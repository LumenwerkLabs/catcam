<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>catcam</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #131318; --panel: #1c1c22; --line: #33323b;
    --fg: #e9e7e2; --dim: #75736d; --accent: #f0a93c; --warn: #d85a30;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 1.25rem;
    font: 16px/1.5 system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--fg);
    display: flex; flex-direction: column; align-items: center; gap: 1.25rem;
  }
  #video {
    width: 100%; max-width: 620px; aspect-ratio: 16/9;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    overflow: hidden; cursor: pointer;
    display: grid; place-items: center; color: var(--dim); font-size: .9rem;
  }
  #feed, #videoMsg { grid-area: 1 / 1; }
  #feed { width: 100%; height: 100%; object-fit: cover; display: block; }
  #video.live #videoMsg { display: none; }
  #video:not(.live) #feed { visibility: hidden; }
  .console {
    width: 100%; max-width: 620px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 1rem 1rem .75rem;
  }
  #dial { display: block; width: 100%; height: auto; touch-action: none; user-select: none; cursor: grab; }
  #dial:active { cursor: grabbing; }
  #dial:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-top: .5rem; }
  .readout { font-variant-numeric: tabular-nums; font-size: 1.75rem; letter-spacing: -.02em; }
  .readout small { font-size: .8rem; color: var(--dim); letter-spacing: .08em; text-transform: uppercase; display: block; }
  .readout.stale { color: var(--warn); }
  .actions { display: flex; gap: .5rem; }
  button {
    font: inherit; font-size: .9rem; padding: .5rem 1rem; border-radius: 8px;
    border: 1px solid var(--line); background: #24232b; color: inherit; cursor: pointer;
  }
  button:hover { border-color: #4a4954; }
  .audio {
    display: flex; align-items: center; gap: .75rem;
    margin-top: .75rem; padding-top: .75rem; border-top: 1px solid var(--line);
    font-size: .9rem; color: var(--dim);
  }
  .audio input[type=range] { flex: 1; accent-color: var(--accent); cursor: pointer; min-width: 0; }
  .audio input[type=range]:disabled { opacity: .35; cursor: default; }
  #listen.on, #talk.on { border-color: var(--accent); color: var(--accent); }
  #talk { touch-action: none; }
  #talk.on { background: var(--accent); color: #131318; }
  #talk:disabled { opacity: .35; cursor: default; }
  #cams { margin-top: .75rem; padding-top: .5rem; border-top: 1px solid var(--line); }
  .ctl {
    display: flex; align-items: center; gap: .75rem;
    margin-top: .5rem; font-size: .9rem; color: var(--dim);
  }
  .ctl > .name { width: 6.5rem; flex: none; }
  .ctl input[type=range] { flex: 1; accent-color: var(--accent); cursor: pointer; min-width: 0; }
  .ctl input[type=range]:disabled { opacity: .35; cursor: default; }
  .ctl output { font-variant-numeric: tabular-nums; color: var(--fg); width: 3.5rem; text-align: right; }
  .ctl label { display: flex; align-items: center; gap: .3rem; cursor: pointer; white-space: nowrap; }
  .tick { stroke: var(--line); }
  .tick.major { stroke: #55535e; }
  .lbl { fill: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<div id="video" title="Clic para reconectar">
  <img id="feed" alt="Cámara">
  <span id="videoMsg">conectando…</span>
</div>

<div class="console">
  <svg id="dial" viewBox="0 0 360 232"
       tabindex="0" role="slider"
       aria-label="Orientación horizontal de la cámara"
       aria-valuemin="0" aria-valuemax="180" aria-valuenow="90" aria-valuetext="90 grados, centro">

    <path d="M 30 195 A 150 150 0 0 1 330 195" fill="none" stroke="#232229" stroke-width="26"/>
    <g id="ticks"></g>
    <path id="fov" fill="var(--accent)" fill-opacity=".16" stroke="var(--accent)" stroke-opacity=".35" stroke-width="1"/>
    <line id="axis" x1="180" y1="195" x2="180" y2="60" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="3 4"/>
    <circle id="knob" cx="180" cy="45" r="11" fill="var(--accent)"/>
    <circle id="knobDot" cx="180" cy="45" r="3.5" fill="#131318"/>
    <g id="cam">
      <rect x="167" y="182" width="26" height="18" rx="4" fill="#3d3b45" stroke="#55535e"/>
      <circle cx="180" cy="191" r="4.5" fill="#131318" stroke="var(--accent)" stroke-width="1.5"/>
    </g>
  </svg>

  <div class="bar">
    <div class="readout" id="readout">90°<small id="zone">centro</small></div>
    <div class="actions">
      <button id="left">← 10°</button>
      <button id="home">Centrar</button>
      <button id="right">10° →</button>
    </div>
  </div>

  <div class="audio">
    <button id="listen">Escuchar</button>
    <button id="talk">Hablar</button>
    <input type="range" id="vol" min="0" max="100" value="80"
           aria-label="Volumen" disabled>
    <span id="audioMsg"></span>
  </div>

  <div id="cams"></div>
</div>

<script>
const CX = 180, CY = 195, R = 150, FOV = 65;
const dial = document.getElementById('dial');
const fov = document.getElementById('fov');
const axis = document.getElementById('axis');
const knob = document.getElementById('knob');
const knobDot = document.getElementById('knobDot');
const cam = document.getElementById('cam');
const readout = document.getElementById('readout');
const zone = document.getElementById('zone');

let angle = 90, sent = 90, inFlight = false;

const pt = (a, r) => {
  const t = (180 - a) * Math.PI / 180;
  return [CX + r * Math.cos(t), CY - r * Math.sin(t)];
};

const ticks = document.getElementById('ticks');
let marks = '';
for (let a = 0; a <= 180; a += 15) {
  const major = a % 45 === 0;
  const [x1, y1] = pt(a, major ? 168 : 172);
  const [x2, y2] = pt(a, 182);
  marks += `<line class="tick${major ? ' major' : ''}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
  if (major) {
    const [lx, ly] = pt(a, 152);
    marks += `<text class="lbl" x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle">${a}</text>`;
  }
}
ticks.innerHTML = marks;

function zoneName(a) {
  if (a < 30) return 'extremo izquierdo';
  if (a < 75) return 'izquierda';
  if (a <= 105) return 'centro';
  if (a <= 150) return 'derecha';
  return 'extremo derecho';
}

function render() {
  const a = Math.round(angle);
  const [ax, ay] = pt(a, R - 22);
  axis.setAttribute('x2', ax); axis.setAttribute('y2', ay);

  const [sx, sy] = pt(a - FOV / 2, R - 8);
  const [ex, ey] = pt(a + FOV / 2, R - 8);
  fov.setAttribute('d', `M ${CX} ${CY} L ${sx} ${sy} A ${R - 8} ${R - 8} 0 0 1 ${ex} ${ey} Z`);

  const [kx, ky] = pt(a, R + 20);
  knob.setAttribute('cx', kx); knob.setAttribute('cy', ky);
  knobDot.setAttribute('cx', kx); knobDot.setAttribute('cy', ky);

  cam.setAttribute('transform', `rotate(${a - 90} ${CX} ${CY})`);

  readout.firstChild.textContent = a + '°';
  zone.textContent = zoneName(a);
  dial.setAttribute('aria-valuenow', a);
  dial.setAttribute('aria-valuetext', `${a} grados, ${zoneName(a)}`);
}

function setAngle(next) {
  angle = Math.max(0, Math.min(180, next));
  render();
  pump();
}

async function pump() {
  if (inFlight) return;
  const target = Math.round(angle);
  if (target === sent) return;
  inFlight = true;
  try {
    const res = await fetch('/api/pan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ angle: target })
    });
    if (!res.ok) throw new Error(res.status);
    sent = target;
    readout.classList.remove('stale');
  } catch (e) {
    readout.classList.add('stale');
  } finally {
    inFlight = false;
    if (Math.round(angle) !== sent) pump();
  }
}

function angleFromEvent(ev) {
  const rect = dial.getBoundingClientRect();
  const s = 360 / rect.width;
  const x = (ev.clientX - rect.left) * s;
  const y = (ev.clientY - rect.top) * s;
  const dx = x - CX;
  const dy = CY - y;

  if (dy <= 0) return dx < 0 ? 0 : 180;

  const t = Math.atan2(dy, dx) * 180 / Math.PI;
  return 180 - t;
}

dial.addEventListener('pointerdown', ev => {
  dial.setPointerCapture(ev.pointerId);
  setAngle(angleFromEvent(ev));
});
dial.addEventListener('pointermove', ev => {
  if (dial.hasPointerCapture(ev.pointerId)) setAngle(angleFromEvent(ev));
});
dial.addEventListener('keydown', ev => {
  const step = ev.shiftKey ? 10 : 2;
  if (ev.key === 'ArrowLeft' || ev.key === 'ArrowDown') setAngle(angle - step);
  else if (ev.key === 'ArrowRight' || ev.key === 'ArrowUp') setAngle(angle + step);
  else if (ev.key === 'Home') setAngle(90);
  else return;
  ev.preventDefault();
});

// -- video ------------------------------------------------------------
// El stream es multipart/x-mixed-replace: se muestra solo en un <img>. El
// evento 'load' no sirve para saber si sigue vivo — el browser lo dispara un
// par de veces al abrir y después se calla, aunque sigan llegando frames.
const video = document.getElementById('video');
const feed = document.getElementById('feed');
const videoMsg = document.getElementById('videoMsg');
let backoff = 1000, retryAt = null;

function connect() {
  clearTimeout(retryAt);
  videoMsg.textContent = 'conectando…';
  feed.src = '/api/stream?t=' + Date.now();   // sin query se sirve de caché
}

function dropFeed(msg) {
  feed.removeAttribute('src');
  video.classList.remove('live');
  videoMsg.textContent = msg;
}

function reconnect() {
  dropFeed('sin video, reintentando…');
  retryAt = setTimeout(connect, backoff);
  backoff = Math.min(backoff * 2, 15000);
}

feed.addEventListener('load', () => {
  backoff = 1000;
  video.classList.add('live');
});
feed.addEventListener('error', () => { if (feed.src) reconnect(); });

// Una pestaña de fondo sigue chupando ~12 Mbit/s del Pi si no la cortamos.
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { clearTimeout(retryAt); dropFeed('en pausa'); }
  else connect();
});

video.onclick = () => { backoff = 1000; connect(); };
connect();

// -- audio ------------------------------------------------------------
// Un solo socket para las dos direcciones. Escuchar decide si reproducimos lo
// que baja; Hablar abre el socket por su cuenta si hace falta, así ninguno de
// los dos botones depende del otro.
const listen = document.getElementById('listen');
const talk = document.getElementById('talk');
const vol = document.getElementById('vol');
const audioMsg = document.getElementById('audioMsg');
const JITTER = 0.15;
// getUserMedia no existe fuera de contexto seguro: sin https no hay micrófono.
const SECURE = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);

let actx = null, gain = null, sock = null, afmt = null, nextAt = 0;
let listening = false, opening = null, micStream = null, tap = null;

function playChunk(bytes) {
  const pcm = new Int16Array(bytes);
  const frames = pcm.length / afmt.channels;
  const buf = actx.createBuffer(afmt.channels, frames, afmt.rate);
  for (let c = 0; c < afmt.channels; c++) {
    const out = buf.getChannelData(c);
    for (let i = 0; i < frames; i++) out[i] = pcm[i * afmt.channels + c] / 32768;
  }
  const src = actx.createBufferSource();
  src.buffer = buf;
  src.connect(gain);
  // Si nos quedamos sin colchón (red o pestaña de fondo) resincronizamos en vez
  // de encadenar chunks que ya llegaron tarde.
  if (nextAt < actx.currentTime + 0.02) nextAt = actx.currentTime + JITTER;
  src.start(nextAt);
  nextAt += buf.duration;
}

function showListening(on) {
  listening = on;
  listen.classList.toggle('on', on);
  listen.textContent = on ? 'Silenciar' : 'Escuchar';
  vol.disabled = !on;
}

function closeSocket(msg) {
  if (sock) { sock.onclose = null; sock.onerror = null; sock.close(); sock = null; }
  afmt = null;
  opening = null;
  stopTalk();
  showListening(false);
  audioMsg.textContent = msg || '';
}

function ensureSocket() {
  if (sock && sock.readyState === 1 && afmt) return Promise.resolve(true);
  if (opening) return opening;
  opening = new Promise(resolve => {
    // 16 kHz en el contexto: lo que capture el worklet ya sale en el formato
    // del server y no hay que remuestrear en JS.
    actx = actx || new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
    actx.resume();
    if (!gain) { gain = actx.createGain(); gain.connect(actx.destination); }
    gain.gain.value = vol.value / 100;
    nextAt = 0;
    audioMsg.textContent = 'conectando…';
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    sock = new WebSocket(proto + '//' + location.host + '/api/audio');
    sock.binaryType = 'arraybuffer';
    sock.onmessage = ev => {
      if (typeof ev.data === 'string') {     // el header de formato viene primero
        afmt = JSON.parse(ev.data);
        audioMsg.textContent = afmt.rate / 1000 + ' kHz';
        opening = null;
        resolve(true);
        return;
      }
      if (afmt && listening) playChunk(ev.data);
    };
    sock.onerror = () => { resolve(false); closeSocket('sin audio'); };
    sock.onclose = () => { resolve(false); closeSocket('sin audio'); };
  });
  return opening;
}

listen.onclick = async () => {
  if (listening) {
    showListening(false);
    if (!talk.classList.contains('on')) closeSocket();
    return;
  }
  if (await ensureSocket()) { nextAt = 0; showListening(true); }
};

vol.oninput = () => { if (gain) gain.gain.value = vol.value / 100; };

// -- hablar (push to talk) --------------------------------------------
const TAP_WORKLET = `
class Tap extends AudioWorkletProcessor {
  process(inputs) {
    const ch = inputs[0][0];
    if (ch) this.port.postMessage(new Float32Array(ch));
    return true;
  }
}
registerProcessor('tap', Tap);
`;

async function openMic() {
  if (tap) return true;
  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });
  } catch (e) {
    audioMsg.textContent = 'sin permiso de micrófono';
    return false;
  }
  const url = URL.createObjectURL(new Blob([TAP_WORKLET], { type: 'application/javascript' }));
  await actx.audioWorklet.addModule(url);
  URL.revokeObjectURL(url);
  tap = new AudioWorkletNode(actx, 'tap');
  tap.port.onmessage = ev => {
    if (!talk.classList.contains('on') || !sock || sock.readyState !== 1) return;
    const f32 = ev.data, pcm = new Int16Array(f32.length);
    for (let i = 0; i < f32.length; i++) {
      const v = Math.max(-1, Math.min(1, f32[i]));
      pcm[i] = v * 32767;
    }
    sock.send(pcm.buffer);
  };
  actx.createMediaStreamSource(micStream).connect(tap);
  return true;
}

async function startTalk(ev) {
  if (ev) ev.preventDefault();
  if (!SECURE || talk.classList.contains('on')) return;
  talk.classList.add('on');                       // feedback antes del await
  const ready = await ensureSocket() && await openMic();
  // Puede haber soltado el botón mientras pedíamos permiso.
  if (!ready || !talk.classList.contains('on')) { talk.classList.remove('on'); return; }
  sock.send(JSON.stringify({ talk: true }));
}

function stopTalk() {
  if (!talk.classList.contains('on')) return;
  talk.classList.remove('on');
  if (sock && sock.readyState === 1) sock.send(JSON.stringify({ talk: false }));
}

if (!SECURE) {
  talk.disabled = true;
  talk.title = 'El micrófono necesita https, o abrir la página en localhost';
}
talk.addEventListener('pointerdown', startTalk);
talk.addEventListener('pointerup', stopTalk);
talk.addEventListener('pointercancel', stopTalk);
talk.addEventListener('pointerleave', stopTalk);
addEventListener('blur', stopTalk);   // si se va el foco, soltamos el botón

// -- controles de la cámara -------------------------------------------
// Las filas se arman con lo que reporta /api/controls, así agregar un control
// en el server no toca este archivo.
const cams = document.getElementById('cams');

const fmt = (c, v) => {
  const n = v / c.scale;
  return (c.scale === 1 ? n : n.toFixed(1).replace(/\.0$/, '')) + c.suffix;
};

async function postControl(name, body, row) {
  try {
    const res = await fetch('/api/controls/' + name, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (res.ok) row.show(await res.json());
  } catch (e) { /* la cámara puede no estar */ }
}

function addRow(c) {
  const row = document.createElement('div');
  row.className = 'ctl';
  row.innerHTML =
    `<span class="name">${c.label}</span>` +
    (c.has_auto ? '<label><input type="checkbox"> auto</label>' : '') +
    `<input type="range" min="${c.min}" max="${c.max}" step="${c.step}"
            aria-label="${c.label}">` +
    '<output></output>';
  cams.appendChild(row);

  const auto = row.querySelector('input[type=checkbox]');
  const range = row.querySelector('input[type=range]');
  const out = row.querySelector('output');
  let timer = null;

  row.show = state => {
    if (auto) { auto.checked = state.auto; range.disabled = state.auto; }
    range.value = state.value;
    out.textContent = state.auto ? 'auto' : fmt(c, state.value);
  };

  range.addEventListener('input', () => {
    out.textContent = fmt(c, +range.value);
    clearTimeout(timer);   // un POST al soltar, no uno por píxel
    timer = setTimeout(() => postControl(c.name, { value: +range.value }, row), 120);
  });
  if (auto) auto.addEventListener('change', () => {
    range.disabled = auto.checked;
    postControl(c.name, auto.checked ? { auto: true } : { value: +range.value }, row);
  });

  row.show(c);
}

fetch('/api/controls')
  .then(r => r.ok ? r.json() : Promise.reject())
  .then(all => Object.values(all).forEach(addRow))
  .catch(() => {});

document.getElementById('left').onclick = () => setAngle(angle - 10);
document.getElementById('right').onclick = () => setAngle(angle + 10);
document.getElementById('home').onclick = () => setAngle(90);

render();
</script>
</body>
</html>
