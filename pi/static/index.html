<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f6f7" id="themeColor">
<title>catcam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* ---- tokens -------------------------------------------------------
     Dos colores de señal, con significado: verde = recibimos (video en
     vivo, escuchando, sobre el eje), ámbar = transmitimos (hablar) o el
     comando quedó sin confirmar. Nada más lleva color. */
  :root {
    --paper:   #f5f6f7;
    --surface: #ffffff;
    --sunken:  #eef0f1;
    --ink:     #13171a;
    --muted:   #6a7278;
    --line:    #e3e6e8;
    --edge:    #d3d8db;
    --rx:      #0f8a6c;
    --rx-soft: rgba(15, 138, 108, .12);
    --tx:      #c77a18;
    --shadow:  0 1px 2px rgba(19, 23, 26, .05), 0 8px 24px -12px rgba(19, 23, 26, .18);
    --r-card:  20px;
    --r-ctl:   12px;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --paper:   #0d1012;
    --surface: #15191c;
    --sunken:  #1c2226;
    --ink:     #e9ecee;
    --muted:   #8b9399;
    --line:    #242a2e;
    --edge:    #333b40;
    --rx:      #2ed3a4;
    --rx-soft: rgba(46, 211, 164, .14);
    --tx:      #e9a63a;
    --shadow:  0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -12px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:   #0d1012;
      --surface: #15191c;
      --sunken:  #1c2226;
      --ink:     #e9ecee;
      --muted:   #8b9399;
      --line:    #242a2e;
      --edge:    #333b40;
      --rx:      #2ed3a4;
      --rx-soft: rgba(46, 211, 164, .14);
      --tx:      #e9a63a;
      --shadow:  0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -12px rgba(0, 0, 0, .7);
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 400 16px/1.5 "Instrument Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 0 1rem env(safe-area-inset-bottom) 1rem;
    transition: background-color .25s ease, color .25s ease;
  }

  .mono {
    font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-variant-numeric: tabular-nums;
  }
  .cap {
    font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: .6875rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
  }

  /* ---- arranque ----
     El gato se banca 3 s aunque el Pi conteste al toque: la conexión al
     stream arranca igual detrás del velo, así la espera no cuesta nada. */
  .boot {
    position: fixed; inset: 0; z-index: 50;
    background: var(--paper); color: var(--ink);
    display: grid; align-content: center; justify-items: center; gap: 1.25rem;
    transition: opacity .45s ease;
  }
  .boot .nyan { width: min(70vw, 340px); }
  .boot.done { opacity: 0; pointer-events: none; }
  .boot[hidden] { display: none; }

  /* ---- barra superior ---- */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: .75rem 1rem; flex-wrap: wrap;
    max-width: 1180px; margin: 0 auto;
    padding: .875rem .25rem;
    background: var(--paper);
    background: color-mix(in srgb, var(--paper) 82%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .brand { display: flex; align-items: center; gap: .5rem; font-weight: 600; letter-spacing: -.01em; }
  .lens {
    width: 15px; height: 15px; border-radius: 50%; flex: none;
    border: 2px solid var(--rx); background: var(--surface);
    box-shadow: inset 0 0 0 2.5px var(--paper);
  }

  .status {
    display: flex; align-items: center; gap: .45rem;
    margin-left: auto;
    padding: .3rem .7rem .3rem .55rem;
    border: 1px solid var(--line); border-radius: 999px;
    background: var(--surface);
    white-space: nowrap;
  }
  .status .dot {
    width: 7px; height: 7px; border-radius: 50%; flex: none;
    background: var(--muted); transition: background-color .2s ease;
  }
  .status[data-state="live"] .dot { background: var(--rx); animation: breathe 2.4s ease-in-out infinite; }
  .status[data-state="warn"] .dot { background: var(--tx); }
  .status[data-state="live"] { border-color: color-mix(in srgb, var(--rx) 35%, var(--line)); }
  button.btn.rx { border-color: var(--rx); }
  @keyframes breathe {
    0%, 100% { box-shadow: 0 0 0 0 var(--rx-soft); }
    50%      { box-shadow: 0 0 0 5px transparent; }
  }

  /* ---- selector de tema ---- */
  .theme {
    position: relative; display: flex; flex: none;
    padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: var(--sunken);
  }
  .theme button {
    position: relative; z-index: 1;
    border: 0; background: none; cursor: pointer; color: var(--muted);
    padding: .3rem .6rem; border-radius: 999px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .625rem; letter-spacing: .08em; text-transform: uppercase;
    transition: color .2s ease;
  }
  .theme button[aria-pressed="true"] { color: var(--ink); }
  .theme .glider {
    position: absolute; top: 3px; bottom: 3px; left: 0;
    border-radius: 999px; background: var(--surface);
    box-shadow: 0 1px 2px rgba(0, 0, 0, .12);
    transition: transform .28s cubic-bezier(.32, .72, 0, 1), width .28s cubic-bezier(.32, .72, 0, 1);
  }

  /* ---- escenario ---- */
  .stage {
    max-width: 1180px; margin: 0 auto;
    display: grid; gap: 1rem; grid-template-columns: 1fr;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-card);
    box-shadow: var(--shadow);
  }

  /* ---- video ---- */
  .viewport {
    position: relative; overflow: hidden; cursor: pointer;
    aspect-ratio: 16 / 9; background: var(--sunken);
    display: grid; place-items: center;
  }
  #feed, .loader { grid-area: 1 / 1; }
  #feed { width: 100%; height: 100%; object-fit: cover; display: block; }
  .viewport.live .loader { display: none; }
  .viewport:not(.live) #feed { visibility: hidden; }

  /* ---- estado de carga: nyan cat en blanco y negro ----
     Todo el gato se dibuja con currentColor, así el mismo SVG sirve en claro
     y en oscuro sin tocar un solo fill. */
  .loader {
    display: grid; justify-items: center; gap: .9rem;
    color: var(--ink); padding: 1rem;
  }
  .nyan { width: min(62%, 300px); height: auto; }
  #videoMsg { color: var(--muted); font-size: .875rem; }

  /* --nyanBg es el color que "perfora" el gato: la pop tart y la cara son
     huecos, no pintura, así el mismo dibujo cae bien sobre cualquier fondo. */
  .loader .nyan { --nyanBg: var(--sunken); }
  .boot   .nyan { --nyanBg: var(--paper); }

  .nyan .ink   { fill: currentColor; }
  .nyan .hole  { fill: var(--nyanBg); }
  .nyan .tart  { fill: var(--nyanBg); stroke: currentColor; stroke-width: 4.5; }
  .nyan .crumb { fill: currentColor; opacity: .45; }
  .nyan .cheek { fill: var(--nyanBg); opacity: .28; }
  .nyan .stars, .nyan .trail { fill: currentColor; }

  /* La estela: seis bandas en grises. Las columnas pares e impares suben y
     bajan en contrafase, que es lo que da el zigzag del original. */
  .nyan .band1 { opacity: 1; }   .nyan .band2 { opacity: .78; }
  .nyan .band3 { opacity: .6; }  .nyan .band4 { opacity: .44; }
  .nyan .band5 { opacity: .3; }  .nyan .band6 { opacity: .18; }

  .nyan .colA { animation: nyanTrail .34s steps(1) infinite alternate; }
  .nyan .colB { animation: nyanTrail .34s steps(1) infinite alternate-reverse; }
  @keyframes nyanTrail { from { transform: translateY(0); } to { transform: translateY(4px); } }

  .nyan .cat  { animation: nyanBob .34s steps(1) infinite alternate; }
  @keyframes nyanBob { from { transform: translateY(0); } to { transform: translateY(-3px); } }

  .nyan .legA { animation: nyanLeg .26s steps(1) infinite alternate; }
  .nyan .legB { animation: nyanLeg .26s steps(1) infinite alternate-reverse; }
  @keyframes nyanLeg { from { transform: translateY(0); } to { transform: translateY(4px); } }

  .nyan .star { animation: nyanStar 1s steps(3) infinite; transform-box: fill-box; transform-origin: center; }
  .nyan .star:nth-of-type(2) { animation-delay: -.33s; }
  .nyan .star:nth-of-type(3) { animation-delay: -.66s; }
  .nyan .star:nth-of-type(4) { animation-delay: -.16s; }
  @keyframes nyanStar {
    0%   { transform: scale(1);  opacity: .55; }
    50%  { transform: scale(.3); opacity: .2; }
    100% { transform: scale(1);  opacity: .55; }
  }
  .viewport::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .06);
  }

  /* ---- panel de control ---- */
  .rail { display: grid; gap: 1rem; align-content: start; }
  .panel { padding: 1.125rem 1.125rem 1rem; }

  #dial { display: block; width: 100%; height: auto; touch-action: none; user-select: none; cursor: grab; }
  #dial:active { cursor: grabbing; }
  #dial:focus-visible { outline: 2px solid var(--rx); outline-offset: 4px; border-radius: var(--r-ctl); }
  .track { stroke: var(--sunken); }
  .arc   { stroke: var(--rx); transition: stroke .25s ease; }
  .stale .arc { stroke: var(--tx); }
  .tick  { stroke: var(--edge); }
  .tick.major { stroke: var(--muted); }
  .lbl   { fill: var(--muted); font-size: 11px; }
  #beamFade stop { stop-color: var(--rx); transition: stop-color .25s ease; }
  .stale #beamFade stop { stop-color: var(--tx); }
  #knob  { fill: var(--rx); transition: fill .25s ease, r .18s cubic-bezier(.32, .72, 0, 1); }
  .stale #knob { fill: var(--tx); }
  #dial:active #knob { r: 14.5; }
  #knobDot { fill: var(--surface); }
  .lensBody { fill: var(--sunken); stroke: var(--edge); }
  .glass { fill: var(--surface); stroke: var(--rx); }
  .sight { stroke: var(--rx); transition: stroke .25s ease; }
  .stale .sight { stroke: var(--tx); }

  .bar { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .readout { line-height: 1.05; }
  .readout .deg {
    display: block; font-size: 2.5rem; font-weight: 500; letter-spacing: -.045em;
    transition: color .25s ease;
  }
  .readout.stale .deg { color: var(--tx); }
  .readout small { display: block; margin-top: .3rem; }
  .actions { display: flex; gap: .4rem; }

  button.btn {
    font: inherit; font-size: .875rem; font-weight: 500;
    padding: .5rem .85rem; border-radius: var(--r-ctl);
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    cursor: pointer; white-space: nowrap;
    transition: border-color .16s ease, background-color .16s ease, transform .16s ease, box-shadow .16s ease, color .16s ease;
  }
  button.btn:hover:not(:disabled) { border-color: var(--edge); box-shadow: var(--shadow); transform: translateY(-1px); }
  button.btn:active:not(:disabled) { transform: translateY(0); box-shadow: none; }
  button.btn:focus-visible { outline: 2px solid var(--rx); outline-offset: 2px; }
  button.btn:disabled { opacity: .4; cursor: default; }
  .ico { display: block; width: 18px; height: 18px; flex: none; }
  button.btn.icon { padding: .5rem; width: 2.375rem; display: grid; place-items: center; }
  button.btn.step { display: flex; align-items: center; gap: .15rem; padding: .5rem .7rem; }
  #listen .i-on { display: none; }
  #listen.rx .i-on { display: block; }
  #listen.rx .i-off { display: none; }
  button.btn.rx { border-color: color-mix(in srgb, var(--rx) 45%, var(--line)); background: var(--rx-soft); color: var(--rx); }
  button.btn.tx { border-color: var(--tx); background: var(--tx); color: var(--surface); }

  /* ---- audio ---- */
  .group { padding: 1rem 1.125rem 1.125rem; }
  .group > .cap { display: block; margin-bottom: .75rem; }
  .audio { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
  .volume .ico { color: var(--muted); }
  #talk { touch-action: none; }
  .volume { display: flex; align-items: center; gap: .6rem; flex: 1 1 9rem; min-width: 0; margin-top: .25rem; }

  input[type=range] {
    flex: 1; min-width: 0; accent-color: var(--rx); cursor: pointer; height: 1.5rem;
  }
  input[type=range]:disabled { opacity: .35; cursor: default; }
  input[type=range]:focus-visible { outline: 2px solid var(--rx); outline-offset: 4px; border-radius: 999px; }
  #audioMsg { color: var(--muted); font-size: .75rem; }

  /* ---- controles de cámara ---- */
  .cams { padding: 0; }
  .cams[hidden] { display: none; }
  .cams > summary {
    list-style: none; cursor: pointer; user-select: none;
    display: flex; align-items: center; gap: .5rem;
    padding: 1rem 1.125rem;
  }
  .cams > summary::-webkit-details-marker { display: none; }
  .cams > summary:focus-visible { outline: 2px solid var(--rx); outline-offset: -2px; border-radius: var(--r-card); }
  .chev { margin-left: auto; color: var(--muted); transition: transform .22s cubic-bezier(.32, .72, 0, 1); }
  .cams[open] .chev { transform: rotate(180deg); }
  .rows { padding: 0 1.125rem 1rem; }
  .ctl {
    display: grid; grid-template-columns: 1fr auto; align-items: center;
    gap: .1rem .75rem; padding: .55rem 0; border-top: 1px solid var(--line);
  }
  .ctl .name { font-size: .875rem; }
  .ctl output { font-size: .8125rem; color: var(--muted); }
  .ctl input[type=range] { grid-column: 1 / -1; }
  .ctl label {
    grid-column: 1 / -1; display: flex; align-items: center; gap: .4rem;
    cursor: pointer; color: var(--muted); font-size: .75rem;
  }
  .ctl label input { accent-color: var(--rx); }

  /* ---- dos columnas ---- */
  @media (max-width: 560px) { .theme { margin-left: auto; } }

  @media (min-width: 900px) {
    .stage { grid-template-columns: minmax(0, 1.55fr) minmax(340px, 1fr); align-items: start; }
    .viewport { position: sticky; top: 4.5rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important; animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>
<body>

<div class="boot" id="boot" role="status" aria-live="polite">
  <span class="cap">starting…</span>
</div>

<header class="topbar">
  <div class="brand"><span class="lens"></span> catcam</div>

  <div class="status" id="status" data-state="wait">
    <span class="dot"></span><span class="cap" id="statusText">connecting</span>
  </div>

  <div class="theme" role="group" aria-label="Theme">
    <span class="glider" id="glider"></span>
    <button data-set="light" aria-pressed="false" aria-label="Light theme" title="Light"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg></button>
    <button data-set="dark"  aria-pressed="false" aria-label="Dark theme" title="Dark"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1z"/></svg></button>
    <button data-set="auto"  aria-pressed="true"  aria-label="Match system theme" title="Auto"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.4"/><path d="M12 3.6a8.4 8.4 0 0 1 0 16.8z" fill="currentColor" stroke="none"/></svg></button>
  </div>
</header>

<main class="stage">

  <section class="card viewport" id="video" title="Click to reconnect">
    <img id="feed" alt="Camera">
    <div class="loader">
      <svg class="nyan" viewBox="0 0 240 104" role="img" aria-label="Loading">
        <g class="stars">
          <path class="star" d="M14 22h4v4h-4z M10 26h4v4h-4z M18 26h4v4h-4z M14 30h4v4h-4z"/>
          <path class="star" d="M44 78h4v4h-4z M40 82h4v4h-4z M48 82h4v4h-4z M44 86h4v4h-4z"/>
          <path class="star" d="M72 12h4v4h-4z M68 16h4v4h-4z M76 16h4v4h-4z M72 20h4v4h-4z"/>
          <path class="star" d="M24 58h4v4h-4z M20 62h4v4h-4z M28 62h4v4h-4z M24 66h4v4h-4z"/>
        </g>

        <g class="trail">
          <g class="colA"><rect class="band1" x="0"  y="34" width="16" height="5"/><rect class="band2" x="0"  y="40" width="16" height="5"/><rect class="band3" x="0"  y="46" width="16" height="5"/><rect class="band4" x="0"  y="52" width="16" height="5"/><rect class="band5" x="0"  y="58" width="16" height="5"/><rect class="band6" x="0"  y="64" width="16" height="5"/></g>
          <g class="colB"><rect class="band1" x="16" y="34" width="16" height="5"/><rect class="band2" x="16" y="40" width="16" height="5"/><rect class="band3" x="16" y="46" width="16" height="5"/><rect class="band4" x="16" y="52" width="16" height="5"/><rect class="band5" x="16" y="58" width="16" height="5"/><rect class="band6" x="16" y="64" width="16" height="5"/></g>
          <g class="colA"><rect class="band1" x="32" y="34" width="16" height="5"/><rect class="band2" x="32" y="40" width="16" height="5"/><rect class="band3" x="32" y="46" width="16" height="5"/><rect class="band4" x="32" y="52" width="16" height="5"/><rect class="band5" x="32" y="58" width="16" height="5"/><rect class="band6" x="32" y="64" width="16" height="5"/></g>
          <g class="colB"><rect class="band1" x="48" y="34" width="16" height="5"/><rect class="band2" x="48" y="40" width="16" height="5"/><rect class="band3" x="48" y="46" width="16" height="5"/><rect class="band4" x="48" y="52" width="16" height="5"/><rect class="band5" x="48" y="58" width="16" height="5"/><rect class="band6" x="48" y="64" width="16" height="5"/></g>
          <g class="colA"><rect class="band1" x="64" y="34" width="16" height="5"/><rect class="band2" x="64" y="40" width="16" height="5"/><rect class="band3" x="64" y="46" width="16" height="5"/><rect class="band4" x="64" y="52" width="16" height="5"/><rect class="band5" x="64" y="58" width="16" height="5"/><rect class="band6" x="64" y="64" width="16" height="5"/></g>
          <g class="colB"><rect class="band1" x="80" y="34" width="18" height="5"/><rect class="band2" x="80" y="40" width="18" height="5"/><rect class="band3" x="80" y="46" width="18" height="5"/><rect class="band4" x="80" y="52" width="18" height="5"/><rect class="band5" x="80" y="58" width="18" height="5"/><rect class="band6" x="80" y="64" width="18" height="5"/></g>
        </g>

        <g class="cat">
          <!-- cola y patas van primero: la pop tart les tapa el nacimiento -->
          <rect class="ink" x="80" y="47" width="18" height="6" rx="3"/>
          <g class="legA"><rect class="ink" x="100" y="66" width="12" height="16" rx="5"/><rect class="ink" x="136" y="66" width="12" height="16" rx="5"/></g>
          <g class="legB"><rect class="ink" x="118" y="66" width="12" height="16" rx="5"/><rect class="ink" x="152" y="66" width="12" height="16" rx="5"/></g>

          <!-- pop tart: hueca con borde, es lo que la separa de la cabeza -->
          <rect class="tart" x="92" y="28" width="72" height="48" rx="11"/>
          <g class="crumb">
            <rect x="106" y="40" width="5" height="5" rx="1"/><rect x="124" y="36" width="5" height="5" rx="1"/>
            <rect x="144" y="44" width="5" height="5" rx="1"/><rect x="112" y="58" width="5" height="5" rx="1"/>
            <rect x="136" y="60" width="5" height="5" rx="1"/><rect x="152" y="32" width="5" height="5" rx="1"/>
          </g>

          <!-- cabeza -->
          <path class="ink" d="M163 38l8-15 9 15z"/>
          <path class="ink" d="M196 38l9-15 8 15z"/>
          <rect class="ink" x="158" y="32" width="58" height="44" rx="13"/>
          <circle class="cheek" cx="169" cy="60" r="6"/>
          <circle class="cheek" cx="205" cy="60" r="6"/>
          <g class="hole">
            <rect x="173" y="47" width="8" height="8" rx="4"/>
            <rect x="194" y="47" width="8" height="8" rx="4"/>
            <rect x="178" y="62" width="19" height="3" rx="1.5"/>
            <rect x="178" y="58" width="3" height="7" rx="1.5"/>
            <rect x="194" y="58" width="3" height="7" rx="1.5"/>
          </g>
        </g>
      </svg>
      <span id="videoMsg">connecting…</span>
    </div>
  </section>

  <div class="rail">

    <section class="card panel" id="panel">
      <svg id="dial" viewBox="0 0 380 200"
           tabindex="0" role="slider"
           aria-label="Camera pan angle"
           aria-valuemin="0" aria-valuemax="180" aria-valuenow="90" aria-valuetext="90 degrees, center">
        <defs>
          <radialGradient id="beamFade" gradientUnits="userSpaceOnUse" cx="190" cy="186" r="110">
            <stop offset="0"   stop-opacity=".30"/>
            <stop offset=".55" stop-opacity=".14"/>
            <stop offset="1"   stop-opacity=".02"/>
          </radialGradient>
          <filter id="knobShadow" x="-60%" y="-60%" width="220%" height="220%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity=".22"/>
          </filter>
        </defs>

        <path class="track" d="M 50 186 A 140 140 0 0 1 330 186"
              fill="none" stroke-width="20" stroke-linecap="round"/>
        <g id="ticks"></g>
        <path id="beam" class="beam" fill="url(#beamFade)"/>
        <line id="sight" class="sight" x1="190" y1="186" x2="190" y2="80"
              stroke-width="1" stroke-opacity=".55"/>
        <path id="arc" class="arc" fill="none" stroke-width="20" stroke-linecap="round" stroke-opacity=".9"/>
        <g id="knobG" filter="url(#knobShadow)">
          <circle id="knob" cx="190" cy="46" r="12.5"/>
          <circle id="knobDot" cx="190" cy="46" r="3.75"/>
        </g>
        <g id="cam">
          <rect class="lensBody" x="177" y="176" width="26" height="18" rx="6" stroke-width="1"/>
          <circle class="glass" cx="190" cy="185" r="4.5" stroke-width="1.5"/>
        </g>
      </svg>

      <div class="bar">
        <div class="readout" id="readout">
          <span class="deg mono" id="deg">90°</span>
          <small class="cap" id="zone">center</small>
        </div>
        <div class="actions">
          <button class="btn step" id="left" aria-label="Pan left 10 degrees" title="Left 10°"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg><span class="mono">10°</span></button>
          <button class="btn icon" id="home" aria-label="Center the camera" title="Center"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="7.4"/><path d="M12 1.8v3.4M12 18.8v3.4M1.8 12h3.4M18.8 12h3.4"/><circle cx="12" cy="12" r="1.7" fill="currentColor" stroke="none"/></svg></button>
          <button class="btn step" id="right" aria-label="Pan right 10 degrees" title="Right 10°"><span class="mono">10°</span><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 5.5L16 12l-6.5 6.5"/></svg></button>
        </div>
      </div>
    </section>

    <section class="card group">
      <span class="cap">Audio</span>
      <div class="audio">
        <button class="btn icon" id="listen" aria-pressed="false" aria-label="Listen" title="Listen"><svg class="ico i-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.5 4.5L6.8 8.8H3.2v6.4h3.6l4.7 4.3z"/><path d="M15.6 9a4.6 4.6 0 0 1 0 6M18.6 6.2a8.6 8.6 0 0 1 0 11.6"/></svg><svg class="ico i-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.5 4.5L6.8 8.8H3.2v6.4h3.6l4.7 4.3z"/><path d="M16.2 9.6l5.2 4.8M21.4 9.6l-5.2 4.8"/></svg></button>
        <button class="btn icon" id="talk" aria-label="Hold to talk" title="Hold to talk"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9.2" y="2.6" width="5.6" height="10.8" rx="2.8"/><path d="M5.6 11.2a6.4 6.4 0 0 0 12.8 0M12 17.6v3.8M9 21.4h6"/></svg></button>
        <span class="cap" id="audioMsg"></span>
      </div>
      <div class="volume">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.5 4.5L6.8 8.8H3.2v6.4h3.6l4.7 4.3z"/><path d="M15.6 9a4.6 4.6 0 0 1 0 6"/></svg>
        <input type="range" id="vol" min="0" max="100" value="80" aria-label="Volume" disabled>
      </div>
    </section>

    <details class="card cams" id="cams" hidden>
      <summary><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.6h3.6L8.4 6h7.2l1.8 2.6H21v10.4H3z"/><circle cx="12" cy="13.4" r="3.3"/></svg><span class="cap">Camera</span>
        <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </summary>
      <div class="rows" id="rows"></div>
    </details>

  </div>
</main>

<script>
// -- arranque ----------------------------------------------------------
// Reusamos el mismo gato del loader del video en vez de repetir el markup.
const boot = document.getElementById('boot');
boot.prepend(document.querySelector('.nyan').cloneNode(true));
setTimeout(() => {
  boot.classList.add('done');
  setTimeout(() => { boot.hidden = true; }, 600);
}, 3000);

// -- tema --------------------------------------------------------------
// Tres estados: claro, oscuro y auto. Auto no escribe data-theme, así el
// media query manda y sigue al sistema en vivo.
const themeBox = document.querySelector('.theme');
const glider = document.getElementById('glider');
const themeColor = document.getElementById('themeColor');
const PAPER = { light: '#f5f6f7', dark: '#0d1012' };

function applyTheme(mode) {
  if (mode === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', mode);
  try { localStorage.setItem('catcam.theme', mode); } catch (e) { /* modo privado */ }

  let active = null;
  for (const b of themeBox.querySelectorAll('button')) {
    const on = b.dataset.set === mode;
    b.setAttribute('aria-pressed', String(on));
    if (on) active = b;
  }
  if (active) {
    glider.style.width = active.offsetWidth + 'px';
    glider.style.transform = 'translateX(' + active.offsetLeft + 'px)';
  }
  const dark = mode === 'dark' ||
    (mode === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  themeColor.content = dark ? PAPER.dark : PAPER.light;
}

let theme = 'auto';
try { theme = localStorage.getItem('catcam.theme') || 'auto'; } catch (e) { /* modo privado */ }
themeBox.addEventListener('click', ev => {
  const b = ev.target.closest('button');
  if (b) applyTheme(theme = b.dataset.set);
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if (theme === 'auto') applyTheme('auto');
});
addEventListener('resize', () => applyTheme(theme));
applyTheme(theme);
// El glider mide botones que todavía no tienen la tipografía cargada.
if (document.fonts) document.fonts.ready.then(() => applyTheme(theme));

// -- dial --------------------------------------------------------------
const CX = 190, CY = 186, R = 140, FOV = 65, BEAM_R = 110;
const dial = document.getElementById('dial');
const panel = document.getElementById('panel');
const beam = document.getElementById('beam');
const sight = document.getElementById('sight');
const arc = document.getElementById('arc');
const knob = document.getElementById('knob');
const knobDot = document.getElementById('knobDot');
const cam = document.getElementById('cam');
const readout = document.getElementById('readout');
const deg = document.getElementById('deg');
const zone = document.getElementById('zone');

let angle = 90, sent = 90, inFlight = false;

const pt = (a, r) => {
  const t = (180 - a) * Math.PI / 180;
  return [CX + r * Math.cos(t), CY - r * Math.sin(t)];
};

const ticks = document.getElementById('ticks');
let marks = '';
for (let a = 0; a <= 180; a += 15) {
  const major = a % 45 === 0;
  const [x1, y1] = pt(a, major ? 116 : 120);
  const [x2, y2] = pt(a, 128);
  marks += `<line class="tick${major ? ' major' : ''}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke-width="${major ? 1.5 : 1}" stroke-linecap="round"/>`;
  if (major) {
    const [lx, ly] = pt(a, 166);
    marks += `<text class="lbl mono" x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle">${a}</text>`;
  }
}
ticks.innerHTML = marks;

function zoneName(a) {
  if (a < 30) return 'far left';
  if (a < 75) return 'left';
  if (a <= 105) return 'center';
  if (a <= 150) return 'right';
  return 'far right';
}

function render() {
  const a = Math.round(angle);

  const [sx2, sy2] = pt(a, BEAM_R - 4);
  sight.setAttribute('x2', sx2); sight.setAttribute('y2', sy2);

  const [bx, by] = pt(a - FOV / 2, BEAM_R);
  const [ex, ey] = pt(a + FOV / 2, BEAM_R);
  beam.setAttribute('d', `M ${CX} ${CY} L ${bx} ${by} A ${BEAM_R} ${BEAM_R} 0 0 1 ${ex} ${ey} Z`);

  // El arco mide la desviación desde el centro, no el ángulo absoluto: de un
  // vistazo se ve cuánto y para qué lado está girada la cámara.
  const [zx, zy] = pt(90, R);
  const [px, py] = pt(a, R);
  arc.setAttribute('d', Math.abs(a - 90) < 1 ? ''
    : `M ${zx} ${zy} A ${R} ${R} 0 0 ${a > 90 ? 1 : 0} ${px} ${py}`);

  const [kx, ky] = pt(a, R);
  knob.setAttribute('cx', kx); knob.setAttribute('cy', ky);
  knobDot.setAttribute('cx', kx); knobDot.setAttribute('cy', ky);

  cam.setAttribute('transform', `rotate(${a - 90} ${CX} ${CY})`);

  deg.textContent = a + '°';
  zone.textContent = zoneName(a);
  dial.setAttribute('aria-valuenow', a);
  dial.setAttribute('aria-valuetext', `${a} degrees, ${zoneName(a)}`);
}

function setAngle(next) {
  angle = Math.max(0, Math.min(180, next));
  render();
  pump();
}

function markStale(on) {
  readout.classList.toggle('stale', on);
  panel.classList.toggle('stale', on);
}

async function pump() {
  if (inFlight) return;
  const target = Math.round(angle);
  if (target === sent) return;
  inFlight = true;
  try {
    const res = await fetch('/api/pan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ angle: target })
    });
    if (!res.ok) throw new Error(res.status);
    sent = target;
    markStale(false);
  } catch (e) {
    markStale(true);
  } finally {
    inFlight = false;
    if (Math.round(angle) !== sent) pump();
  }
}

function angleFromEvent(ev) {
  const rect = dial.getBoundingClientRect();
  const s = 380 / rect.width;
  const x = (ev.clientX - rect.left) * s;
  const y = (ev.clientY - rect.top) * s;
  const dx = x - CX;
  const dy = CY - y;

  if (dy <= 0) return dx < 0 ? 0 : 180;

  const t = Math.atan2(dy, dx) * 180 / Math.PI;
  return 180 - t;
}

dial.addEventListener('pointerdown', ev => {
  dial.setPointerCapture(ev.pointerId);
  setAngle(angleFromEvent(ev));
});
dial.addEventListener('pointermove', ev => {
  if (dial.hasPointerCapture(ev.pointerId)) setAngle(angleFromEvent(ev));
});
dial.addEventListener('keydown', ev => {
  const step = ev.shiftKey ? 10 : 2;
  if (ev.key === 'ArrowLeft' || ev.key === 'ArrowDown') setAngle(angle - step);
  else if (ev.key === 'ArrowRight' || ev.key === 'ArrowUp') setAngle(angle + step);
  else if (ev.key === 'Home') setAngle(90);
  else return;
  ev.preventDefault();
});

// -- video ------------------------------------------------------------
// El stream es multipart/x-mixed-replace: se muestra solo en un <img>. El
// evento 'load' no sirve para saber si sigue vivo — el browser lo dispara un
// par de veces al abrir y después se calla, aunque sigan llegando frames.
const video = document.getElementById('video');
const feed = document.getElementById('feed');
const videoMsg = document.getElementById('videoMsg');
const statusPill = document.getElementById('status');
const statusText = document.getElementById('statusText');
let backoff = 1000, retryAt = null;

function setStatus(text, state) {
  statusText.textContent = text;
  statusPill.dataset.state = state;
}

function connect() {
  clearTimeout(retryAt);
  videoMsg.textContent = 'connecting…';
  setStatus('connecting', 'wait');
  feed.src = '/api/stream?t=' + Date.now();   // sin query se sirve de caché
}

function dropFeed(msg) {
  feed.removeAttribute('src');
  video.classList.remove('live');
  videoMsg.textContent = msg;
}

function reconnect() {
  dropFeed('no video, retrying…');
  setStatus('no signal', 'warn');
  retryAt = setTimeout(connect, backoff);
  backoff = Math.min(backoff * 2, 15000);
}

feed.addEventListener('load', () => {
  backoff = 1000;
  video.classList.add('live');
  setStatus('live', 'live');
});
feed.addEventListener('error', () => { if (feed.src) reconnect(); });

// Una pestaña de fondo sigue chupando ~12 Mbit/s del Pi si no la cortamos.
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { clearTimeout(retryAt); dropFeed('paused'); setStatus('paused', 'idle'); }
  else connect();
});

video.onclick = () => { backoff = 1000; connect(); };
connect();

// -- audio ------------------------------------------------------------
// Un solo socket para las dos direcciones. Escuchar decide si reproducimos lo
// que baja; Hablar abre el socket por su cuenta si hace falta, así ninguno de
// los dos botones depende del otro.
const listen = document.getElementById('listen');
const talk = document.getElementById('talk');
const vol = document.getElementById('vol');
const audioMsg = document.getElementById('audioMsg');
const JITTER = 0.15;
// getUserMedia no existe fuera de contexto seguro: sin https no hay micrófono.
const SECURE = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);

let actx = null, gain = null, sock = null, afmt = null, nextAt = 0;
let listening = false, opening = null, micStream = null, tap = null;

function playChunk(bytes) {
  const pcm = new Int16Array(bytes);
  const frames = pcm.length / afmt.channels;
  const buf = actx.createBuffer(afmt.channels, frames, afmt.rate);
  for (let c = 0; c < afmt.channels; c++) {
    const out = buf.getChannelData(c);
    for (let i = 0; i < frames; i++) out[i] = pcm[i * afmt.channels + c] / 32768;
  }
  const src = actx.createBufferSource();
  src.buffer = buf;
  src.connect(gain);
  // Si nos quedamos sin colchón (red o pestaña de fondo) resincronizamos en vez
  // de encadenar chunks que ya llegaron tarde.
  if (nextAt < actx.currentTime + 0.02) nextAt = actx.currentTime + JITTER;
  src.start(nextAt);
  nextAt += buf.duration;
}

function showListening(on) {
  listening = on;
  listen.classList.toggle('rx', on);
  listen.setAttribute('aria-pressed', String(on));
  listen.title = on ? 'Mute' : 'Listen';
  listen.setAttribute('aria-label', on ? 'Mute' : 'Listen');
  vol.disabled = !on;
}

function closeSocket(msg) {
  if (sock) { sock.onclose = null; sock.onerror = null; sock.close(); sock = null; }
  afmt = null;
  opening = null;
  stopTalk();
  showListening(false);
  audioMsg.textContent = msg || '';
}

function ensureSocket() {
  if (sock && sock.readyState === 1 && afmt) return Promise.resolve(true);
  if (opening) return opening;
  opening = new Promise(resolve => {
    // 16 kHz en el contexto: lo que capture el worklet ya sale en el formato
    // del server y no hay que remuestrear en JS.
    actx = actx || new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
    actx.resume();
    if (!gain) { gain = actx.createGain(); gain.connect(actx.destination); }
    gain.gain.value = vol.value / 100;
    nextAt = 0;
    audioMsg.textContent = 'connecting…';
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    sock = new WebSocket(proto + '//' + location.host + '/api/audio');
    sock.binaryType = 'arraybuffer';
    sock.onmessage = ev => {
      if (typeof ev.data === 'string') {     // el header de formato viene primero
        afmt = JSON.parse(ev.data);
        audioMsg.textContent = afmt.rate / 1000 + ' kHz';
        opening = null;
        resolve(true);
        return;
      }
      if (afmt && listening) playChunk(ev.data);
    };
    sock.onerror = () => { resolve(false); closeSocket('no audio'); };
    sock.onclose = () => { resolve(false); closeSocket('no audio'); };
  });
  return opening;
}

listen.onclick = async () => {
  if (listening) {
    showListening(false);
    if (!talk.classList.contains('tx')) closeSocket();
    return;
  }
  if (await ensureSocket()) { nextAt = 0; showListening(true); }
};

vol.oninput = () => { if (gain) gain.gain.value = vol.value / 100; };

// -- hablar (push to talk) --------------------------------------------
const TAP_WORKLET = `
class Tap extends AudioWorkletProcessor {
  process(inputs) {
    const ch = inputs[0][0];
    if (ch) this.port.postMessage(new Float32Array(ch));
    return true;
  }
}
registerProcessor('tap', Tap);
`;

async function openMic() {
  if (tap) return true;
  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });
  } catch (e) {
    audioMsg.textContent = 'microphone blocked';
    return false;
  }
  const url = URL.createObjectURL(new Blob([TAP_WORKLET], { type: 'application/javascript' }));
  await actx.audioWorklet.addModule(url);
  URL.revokeObjectURL(url);
  tap = new AudioWorkletNode(actx, 'tap');
  tap.port.onmessage = ev => {
    if (!talk.classList.contains('tx') || !sock || sock.readyState !== 1) return;
    const f32 = ev.data, pcm = new Int16Array(f32.length);
    for (let i = 0; i < f32.length; i++) {
      const v = Math.max(-1, Math.min(1, f32[i]));
      pcm[i] = v * 32767;
    }
    sock.send(pcm.buffer);
  };
  actx.createMediaStreamSource(micStream).connect(tap);
  return true;
}

async function startTalk(ev) {
  if (ev) ev.preventDefault();
  if (!SECURE || talk.classList.contains('tx')) return;
  talk.classList.add('tx');                       // feedback antes del await
  const ready = await ensureSocket() && await openMic();
  // Puede haber soltado el botón mientras pedíamos permiso.
  if (!ready || !talk.classList.contains('tx')) { talk.classList.remove('tx'); return; }
  sock.send(JSON.stringify({ talk: true }));
}

function stopTalk() {
  if (!talk.classList.contains('tx')) return;
  talk.classList.remove('tx');
  if (sock && sock.readyState === 1) sock.send(JSON.stringify({ talk: false }));
}

if (!SECURE) {
  talk.disabled = true;
  talk.title = 'The microphone needs https, or open the page on localhost';
}
talk.addEventListener('pointerdown', startTalk);
talk.addEventListener('pointerup', stopTalk);
talk.addEventListener('pointercancel', stopTalk);
talk.addEventListener('pointerleave', stopTalk);
addEventListener('blur', stopTalk);   // si se va el foco, soltamos el botón

// -- controles de la cámara -------------------------------------------
// Las filas se arman con lo que reporta /api/controls, así agregar un control
// en el server no toca este archivo.
const camsBox = document.getElementById('cams');
const rows = document.getElementById('rows');

const fmt = (c, v) => {
  const n = v / c.scale;
  return (c.scale === 1 ? n : n.toFixed(1).replace(/\.0$/, '')) + c.suffix;
};

async function postControl(name, body, row) {
  try {
    const res = await fetch('/api/controls/' + name, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (res.ok) row.show(await res.json());
  } catch (e) { /* la cámara puede no estar */ }
}

function addRow(c) {
  const row = document.createElement('div');
  row.className = 'ctl';
  row.innerHTML =
    `<span class="name">${c.label}</span>` +
    '<output class="mono"></output>' +
    `<input type="range" min="${c.min}" max="${c.max}" step="${c.step}"
            aria-label="${c.label}">` +
    (c.has_auto ? '<label><input type="checkbox"> auto</label>' : '');
  rows.appendChild(row);

  const auto = row.querySelector('input[type=checkbox]');
  const range = row.querySelector('input[type=range]');
  const out = row.querySelector('output');
  let timer = null;

  row.show = state => {
    if (auto) { auto.checked = state.auto; range.disabled = state.auto; }
    range.value = state.value;
    out.textContent = state.auto ? 'auto' : fmt(c, state.value);
  };

  range.addEventListener('input', () => {
    out.textContent = fmt(c, +range.value);
    clearTimeout(timer);   // un POST al soltar, no uno por píxel
    timer = setTimeout(() => postControl(c.name, { value: +range.value }, row), 120);
  });
  if (auto) auto.addEventListener('change', () => {
    range.disabled = auto.checked;
    postControl(c.name, auto.checked ? { auto: true } : { value: +range.value }, row);
  });

  row.show(c);
}

fetch('/api/controls')
  .then(r => r.ok ? r.json() : Promise.reject())
  .then(all => {
    const list = Object.values(all);
    if (!list.length) return;
    camsBox.hidden = false;
    list.forEach(addRow);
  })
  .catch(() => {});

document.getElementById('left').onclick = () => setAngle(angle - 10);
document.getElementById('right').onclick = () => setAngle(angle + 10);
document.getElementById('home').onclick = () => setAngle(90);

render();
</script>
</body>
</html>
